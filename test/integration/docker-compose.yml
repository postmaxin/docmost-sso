# End-to-end test: pinned Docmost + Postgres 18 + Redis 8 + docmost-sso + a
# mock OIDC provider, behind an nginx that routes like the production ALB.
# Run via ./run.sh (or `npm run test:integration`).
name: docmost-sso-it

x-secret: &app_secret "integration-test-app-secret-0123456789abcdef"

services:
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: docmost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: ["/var/lib/postgresql"]

  redis:
    image: redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  docmost:
    image: docmost/docmost:0.97.0@sha256:40c454d74ffdd9ecb15833e4d96f3a630d59aad862a1869381ae6ee086454419
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_URL: http://docs:8000
      APP_SECRET: *app_secret
      JWT_TOKEN_EXPIRES_IN: 7d
      DATABASE_URL: postgresql://docmost:docmost@postgres:5432/docmost?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      MAIL_DRIVER: smtp
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "25"

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.7@sha256:f67032396f2ee4320d09389a174ef04112c754e49ce26f060050a66c1c07aedb
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'

  sso:
    build:
      context: ../..
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      APP_URL: http://docs:8000
      APP_SECRET: *app_secret
      SESSION_TTL: 7d
      DATABASE_URL: postgresql://docmost:docmost@postgres:5432/docmost?sslmode=disable
      OIDC_ISSUER: http://mock-oidc:8080/default
      OIDC_ALLOW_INSECURE_ISSUER: "true"
      OIDC_CLIENT_ID: docmost-sso-it
      OIDC_CLIENT_SECRET: not-a-real-secret
      SSO_ALLOWED_DOMAINS: example.com
      SSO_PROVIDER_NAME: Mock IdP
      PORT: "8080"

  # Stands in for the ALB: /sso/* -> shim, everything else -> Docmost.
  docs:
    image: nginx:1-alpine@sha256:72aeb3308ef6cb3118242fb16389518923916dfa206e32d1a8377acc328b9870
    depends_on: [docmost, sso]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  tester:
    build:
      context: ../..
      target: build
    depends_on: [docs, mock-oidc]
    environment:
      BASE_URL: http://docs:8000
      DATABASE_URL: postgresql://docmost:docmost@postgres:5432/docmost
    volumes:
      - ./e2e.mjs:/app/test/integration/e2e.mjs:ro
    command: ["node", "test/integration/e2e.mjs"]
